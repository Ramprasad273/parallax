name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run Test Suite & Coverage Gate
        run: |
          pytest -v -ra --cov=parallax --cov-report=term-missing --cov-fail-under=80 > test_output.log 2>&1 || {
            STATUS=$?
            FAILURES=$(grep -A 20 -E "FAILURES|SHORT TEST SUMMARY|FAILED " test_output.log | tr '\n' ' ' | head -c 500)
            COV_FAIL=$(grep -E "FAIL Required test coverage|TOTAL" test_output.log || true)
            echo "::error title=PytestFailure::Exit $STATUS | Failures: $FAILURES | Cov: $COV_FAIL"
            cat test_output.log
            exit $STATUS
          }


      - name: Run Ruff Lint Check
        run: |
          ruff check parallax tests

      - name: Run Mypy Type Checker
        run: |
          mypy parallax
