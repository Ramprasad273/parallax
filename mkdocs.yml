site_name: Parallax
site_description: Zero-Config Blast Radius & Semantic Drift CI for SQL and dbt
site_author: Parallax Contributors
repo_url: https://github.com/Ramprasad273/parallax
repo_name: Ramprasad273/parallax

theme:
  name: material
  language: en
  palette:
    # Slate / Dark mode by default
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode toggle
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Sample Report & Interpretation: sample-report.md
  - Core Concepts:
      - Semantic Drift & AST Diffing: concepts/semantic-drift.md
      - Lineage DAG & Blast Radius: concepts/lineage.md
      - Risk Scoring Engine: concepts/risk-scoring.md
  - CI/CD Integration:
      - GitHub Action Workflow: cicd/github-actions.md
      - PR Comments & Reports: cicd/pr-comments.md
  - Reference:
      - CLI Commands: reference/cli.md
      - Configuration (.parallax.yml): reference/configuration.md
      - Security & Compliance: reference/compliance-and-security.md
